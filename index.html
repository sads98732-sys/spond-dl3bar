<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090909"><title>جنات: ظل الجلابة</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial;overflow:hidden;height:100%}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:auto}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#271313 0,#090707 45%,#000 100%);z-index:5}.panel{width:min(92vw,720px);padding:28px;border:1px solid #5b3030;border-radius:20px;background:rgba(10,7,7,.9);box-shadow:0 0 60px #000;text-align:center}.title{font-size:clamp(34px,7vw,68px);margin:0 0 8px;letter-spacing:-2px}.red{color:#c43b3b}.sub{opacity:.72;line-height:1.8}.btn{border:1px solid #754040;background:#241010;color:#fff;padding:13px 20px;border-radius:12px;font-size:16px;margin:7px;cursor:pointer}.btn:hover{background:#391515}.chars{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.char{width:150px;padding:14px;border:1px solid #3c2929;border-radius:14px;background:#110e0e;cursor:pointer}.char.sel{border-color:#d05b5b;box-shadow:0 0 18px #5c2020}.face{font-size:44px}.hud{position:fixed;inset:0;pointer-events:none;z-index:2}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px}.badge{background:rgba(0,0,0,.58);border:1px solid #4a3636;border-radius:12px;padding:8px 11px;font-size:13px}.objective{position:absolute;top:62px;right:14px;max-width:330px;background:rgba(0,0,0,.48);padding:10px 13px;border-radius:12px;border-right:3px solid #a63b3b}.fear{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(300px,55vw);height:6px;border-radius:6px;background:#261b1b;overflow:hidden}.fear i{display:block;height:100%;background:#bd3434;width:0}.hint{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:9px 14px;border-radius:10px;opacity:0;transition:.2s}.mobile{position:fixed;inset:0;z-index:3;pointer-events:none}.stick{position:absolute;bottom:35px;left:25px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);pointer-events:auto}.knob{position:absolute;width:55px;height:55px;border-radius:50%;background:rgba(190,70,70,.35);left:37px;top:37px}.look{position:absolute;right:0;top:0;width:55%;height:75%;pointer-events:auto}.act{position:absolute;bottom:45px;right:28px;display:flex;gap:10px;pointer-events:auto}.circle{width:58px;height:58px;border-radius:50%;border:1px solid #744;background:rgba(20,10,10,.65);color:white;font-size:21px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10;display:none;align-items:center;justify-content:center}.modal .box{width:min(90vw,440px);background:#120d0d;border:1px solid #633;border-radius:18px;padding:22px;text-align:center}.code{font-size:28px;letter-spacing:8px;background:#050505;border:1px solid #443;padding:12px;margin:14px 0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{padding:12px;background:#241515;color:#fff;border:1px solid #4a2929;border-radius:9px}.hide{display:none!important}</style></head><body><canvas id="c"></canvas>
<div id="menu" class="screen"><div class="panel"><h1 class="title">جنات: <span class="red">ظل الجلابة</span></h1><p class="sub">رعب مغربي أصلي بمنظور الشخص الأول.<br>قاتل غامض يطارد جنات، وعليها حل الألغاز وإنقاذ أصدقائها.</p><div class="chars"><div class="char sel" data-char="j"><div class="face">👩🏻</div><b>جنات</b><small>متوازنة</small></div><div class="char" data-char="y"><div class="face">🧑🏽</div><b>ياسين</b><small>أسرع</small></div><div class="char" data-char="s"><div class="face">👩🏽</div><b>سلمى</b><small>تخفي أفضل</small></div></div><button id="start" class="btn">ابدأ الهروب</button><p class="sub" style="font-size:12px">الهاتف: عصا للحركة + سحب يمين الشاشة للنظر + زر 👋 للتفاعل<br>الحاسوب: WASD + الفأرة + E</p></div></div>
<canvas id="game"></canvas><div id="hud" class="hud hide"><div class="top"><div class="badge" id="stage">المرحلة 1</div><div class="badge">🫖 <span id="tea">0</span> &nbsp; 🍲 <span id="tag">0</span></div></div><div class="objective" id="obj">...</div><div class="fear"><i id="fear"></i></div><div class="hint" id="hint">اضغط للتفاعل</div></div><div id="mobile" class="mobile hide"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div id="look" class="look"></div><div class="act"><button id="use" class="circle">👋</button><button id="run" class="circle">🏃</button></div></div>
<div id="modal" class="modal"><div class="box"><h2 id="mtitle">لغز</h2><p id="mtext"></p><div class="code" id="code">_ _ _</div><div class="keys" id="keys"></div><button class="btn" id="close">إغلاق</button></div></div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d'),G=document.getElementById('game'),g=G.getContext('2d');let W,H;function resize(){W=C.width=G.width=innerWidth;H=C.height=G.height=innerHeight}addEventListener('resize',resize);resize();
const levels=[{name:'ساحة جامع الفنا',color:'#3b2721',obj:'ابحث عن 3 رموز مخفية وافتح بوابة الساحة.',code:'314',count:3,story:'الليل يهبط على الساحة... جنات تسمع أصوات أصدقائها من خلف باب قديم.'},{name:'تطوان',color:'#213e45',obj:'اعثر على المفتاح الأزرق ثم فك شفرة الباب.',code:'527',count:2,story:'الأزقة البيضاء تلتف حولك. هناك خطوات خلفك... لا تلتف كثيراً.'},{name:'فاس',color:'#402b20',obj:'حرر الأصدقاء الثلاثة ثم اخرج من المدينة القديمة.',code:'906',count:4,story:'آخر مرحلة. القاتل يعرف الطريق جيداً، لكن جنات تعرف أن النور قريب.'}];
let L=0,chosen='j',p={x:2,y:2,a:0,s:2.7},killer={x:9,y:9},items=[],collected=0,slow=0,opened=false,over=false,keys={};const maps=[['###############','#.............#','#..###........#','#........###..#','#.............#','#..#..........#','#..#..###.....#','#.............#','#.....#.......#','#.............#','###############'],['###############','#.............#','#.#####.......#','#.............#','#.....###.....#','#.............#','#...#.........#','#...#....###..#','#.............#','#.............#','###############'],['###############','#.............#','#...####......#','#.............#','#..##.........#','#..............','#......###....#','#.............#','#....#........#','#.............#','###############']];
function map(){return maps[L]}function wall(x,y){let m=map(),ix=Math.floor(x),iy=Math.floor(y);return !m[iy]||m[iy][ix]==='#'}function resetLevel(){p={x:2.2,y:2.2,a:0,s:chosen==='y'?3.1:chosen==='s'?2.5:2.7};killer={x:10.5,y:8.5};collected=0;opened=false;over=false;items=[];let m=map();let spots=[[4,1],[7,2],[11,3],[3,5],[8,5],[12,7],[6,8],[10,9],[2,8]];for(let i=0;i<levels[L].count;i++){let [x,y]=spots[(L*3+i)%spots.length];items.push({x:x+.5,y:y+.5,type:i%2?'tag':'tea',got:false})}updateHUD()}
function updateHUD(){document.getElementById('stage').textContent=`المرحلة ${L+1} — ${levels[L].name}`;document.getElementById('obj').textContent=levels[L].obj;document.getElementById('tea').textContent=items.filter(i=>i.got&&i.type==='tea').length;document.getElementById('tag').textContent=items.filter(i=>i.got&&i.type==='tag').length}
function start(){document.getElementById('menu').classList.add('hide');document.getElementById('hud').classList.remove('hide');document.getElementById('mobile').classList.remove('hide');resetLevel();audio()}document.getElementById('start').onclick=start;document.querySelectorAll('.char').forEach(e=>e.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');chosen=e.dataset.char});
function say(t){let h=document.getElementById('hint');h.textContent=t;h.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>h.style.opacity=0,1800)}
function modal(){document.getElementById('modal').style.display='flex';document.getElementById('mtitle').textContent='الباب مقفل';document.getElementById('mtext').textContent='وجدت نقشاً على الجدار. أدخل الشفرة الصحيحة.';let val='';let cd=document.getElementById('code');cd.textContent='_ _ _';let ks=document.getElementById('keys');ks.innerHTML='';for(let i=1;i<=9;i++){let b=document.createElement('button');b.textContent=i;b.onclick=()=>{if(val.length<3){val+=i;cd.textContent=val.split('').join(' ');if(val===levels[L].code){opened=true;document.getElementById('modal').style.display='none';say('تم فتح الباب! اهرب!');beep(520,.25)}}};ks.appendChild(b)}let z=document.createElement('button');z.textContent='0';z.onclick=()=>{if(val.length<3){val+=0;cd.textContent=val.split('').join(' ')}};ks.appendChild(z)}document.getElementById('close').onclick=()=>document.getElementById('modal').style.display='none';
function interact(){if(over)return;let near=items.find(i=>!i.got&&Math.hypot(i.x-p.x,i.y-p.y)<1.15);if(near){near.got=true;collected++;slow+=6;beep(760,.12);say(near.type==='tea'?'🫖 براد أتاي! القاتل تباطأ.':'🍲 طاجين! القاتل تباطأ.');updateHUD();return}if(collected>=levels[L].count&&!opened){modal();return}if(opened&&Math.hypot(p.x-12.5,p.y-9.5)<2){L++;if(L>=3){victory();return}say(levels[L].story);resetLevel();}}
function victory(){over=true;document.getElementById('obj').textContent='🎉 أنقذت أصدقاءك! انتهت الرحلة.';say('نجوتِ من ظل الجلابة.');beep(900,.5)}
let joy={x:0,y:0},run=false;document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')interact()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.getElementById('run').onpointerdown=()=>run=true;document.getElementById('run').onpointerup=()=>run=false;document.getElementById('use').onclick=interact;
let st=document.getElementById('stick'),kn=document.getElementById('knob');st.onpointermove=e=>{let r=st.getBoundingClientRect(),dx=e.clientX-(r.left+65),dy=e.clientY-(r.top+65),d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*d/50;joy.y=Math.sin(a)*d/50;kn.style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`};st.onpointerup=()=>{joy.x=joy.y=0;kn.style.transform=''};
let lastX=null;document.getElementById('look').onpointerdown=e=>lastX=e.clientX;document.getElementById('look').onpointermove=e=>{if(lastX!==null){p.a+=(e.clientX-lastX)*.006;lastX=e.clientX}};document.getElementById('look').onpointerup=()=>lastX=null;
function move(dt){let f=(keys.w?1:0)-(keys.s?1:0)-joy.y;let str=(keys.d?1:0)-(keys.a?1:0)+joy.x;if(f||str){let sp=p.s*(run?1.35:1)*dt;let nx=p.x+(Math.cos(p.a)*f-Math.sin(p.a)*str)*sp,ny=p.y+(Math.sin(p.a)*f+Math.cos(p.a)*str)*sp;if(!wall(nx,p.y))p.x=nx;if(!wall(p.x,ny))p.y=ny}if(keys.arrowleft)p.a-=dt*2.3;if(keys.arrowright)p.a+=dt*2.3}
function ai(dt){if(slow>0)slow-=dt;let dx=p.x-killer.x,dy=p.y-killer.y,d=Math.hypot(dx,dy);let speed=(slow>0?.35:.72)*dt;if(d<7){let nx=killer.x+dx/d*speed,ny=killer.y+dy/d*speed;if(!wall(nx,killer.y))killer.x=nx;if(!wall(killer.x,ny))killer.y=ny}if(d<.65&&!over){document.getElementById('obj').textContent='☠️ أمسك بك! اضغط ابدأ لإعادة المحاولة.';say('هربتِ للحظة... لكنه وجدك!');over=true;beep(100,.5)}}
function ray(){let fov=Math.PI/3,cols=Math.min(500,Math.floor(W/2));g.clearRect(0,0,W,H);g.fillStyle=levels[L].color;g.fillRect(0,0,W,H/2);g.fillStyle='#0b0b0d';g.fillRect(0,H/2,W,H/2);for(let x=0;x<cols;x++){let cam=(x/cols-.5)*fov,ra=p.a+cam,dx=Math.cos(ra),dy=Math.sin(ra),dist=0;while(dist<18){dist+=.025;let xx=p.x+dx*dist,yy=p.y+dy*dist;if(wall(xx,yy))break}let cd=dist*Math.cos(cam),hh=Math.min(H*2,H/(cd+.001)),shade=Math.max(25,180-cd*18);g.fillStyle=`rgb(${shade},${Math.floor(shade*.72)},${Math.floor(shade*.6)})`;g.fillRect(x*W/cols,(H-hh)/2,W/cols+1,hh)}}
function sprites(){let arr=[...items.filter(i=>!i.got).map(i=>({...i,k:0})),{x:killer.x,y:killer.y,k:1}];arr.sort((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)-Math.hypot(a.x-p.x,a.y-p.y));for(let o of arr){let dx=o.x-p.x,dy=o.y-p.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-p.a;while(ang<-Math.PI)ang+=Math.PI*2;while(ang>Math.PI)ang-=Math.PI*2;if(Math.abs(ang)>Math.PI/3)continue;let sx=W/2+Math.tan(ang)*(W/1.732),size=Math.min(H*1.2,H/(dist+.1));if(o.k){g.font=`${Math.floor(size*.55)}px serif`;g.fillText('🧥',sx-size*.22,H/2+size*.25);g.font=`${Math.floor(size*.22)}px serif`;g.fillText('👁️',sx-size*.09,H/2-size*.18)}else{g.font=`${Math.floor(size*.28)}px serif`;g.fillText(o.type==='tea'?'🫖':'🍲',sx-size*.14,H/2+size*.15)}}}
function audio(){try{window.ac=new AudioContext()}catch(e){}}function beep(freq,d){try{let o=ac.createOscillator(),q=ac.createGain();o.frequency.value=freq;o.connect(q);q.connect(ac.destination);q.gain.setValueAtTime(.03,ac.currentTime);q.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let t0=performance.now();function loop(t){let dt=Math.min(.05,(t-t0)/1000);t0=t; if(!over){move(dt);ai(dt)}ray();sprites();let d=Math.hypot(p.x-killer.x,p.y-killer.y);document.getElementById('fear').style.width=Math.max(0,Math.min(100,(1-d/8)*100))+'%';requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
