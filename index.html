<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مغامرة الإسفنج</title>
<meta name="theme-color" content="#0b5ea8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مغامرة الإسفنج">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
html,body{margin:0;height:100%;background:#0b3a6a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),F=12;
let W,H,hz,gy,LW,cx;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;cx=W/2;hz=H*.3;gy=H*.82;LW=Math.min(W*.27,H*.2)}
resize();addEventListener('resize',resize);

let state='menu',dist=0,speed=12,score=0,coins=0,objs=[],nextRow=25,lane=0,px=0,jh=0,vy=0,slide=0,best=0,deadAt=0;
try{best=+localStorage.getItem('best')||0}catch(e){}

function start(){dist=0;speed=12;score=0;coins=0;objs=[];nextRow=25;lane=0;px=0;jh=0;vy=0;slide=0;state='play'}
function move(d){lane=Math.max(-1,Math.min(1,lane+d))}
function jump(){if(jh===0&&vy===0){vy=9.5;slide=0}}
function down(){if(jh>0)vy=-14;else slide=.6}

function P(l,d){const s=F/(F+d);return{x:cx+l*LW*s,y:hz+(gy-hz)*s,s}}
function band(d0,d1,l0,l1,col){const a=P(0,d0),b=P(0,d1);ctx.fillStyle=col;ctx.beginPath();
ctx.moveTo(cx+l0*LW*a.s,a.y);ctx.lineTo(cx+l1*LW*a.s,a.y);ctx.lineTo(cx+l1*LW*b.s,b.y);ctx.lineTo(cx+l0*LW*b.s,b.y);ctx.fill()}
function box(l,d,w,h,col,top,len,y0){
const a=P(l,d),u=LW*a.s,by=a.y-(y0||0)*u;
if(len){const b=P(l,d+len),ub=LW*b.s,bb=b.y-(y0||0)*ub;ctx.fillStyle=top;ctx.beginPath();
ctx.moveTo(a.x-w*u/2,by-h*u);ctx.lineTo(a.x+w*u/2,by-h*u);ctx.lineTo(b.x+w*ub/2,bb-h*ub);ctx.lineTo(b.x-w*ub/2,bb-h*ub);ctx.fill()}
ctx.fillStyle=col;ctx.fillRect(a.x-w*u/2,by-h*u,w*u,h*u)}
function tx(s,x,y,size,col,al){ctx.font='700 '+size+'px Tahoma,Arial,sans-serif';ctx.fillStyle=col;ctx.textAlign=al||'center';ctx.fillText(s,x,y)}

function spawn(z){
const r=Math.random(),free=(Math.random()*3|0)-1;let extra=0;
if(r<.3){for(let i=0;i<6;i++)objs.push({t:'coin',l:free,z:z+i*1.5})}
else if(r<.55){let m=0;for(let l=-1;l<=1;l++)if(l!==free&&Math.random()<.8){const len=5+Math.random()*4;m=Math.max(m,len);objs.push({t:'train',l,z,len})}
for(let i=0;i<5;i++)objs.push({t:'coin',l:free,z:z+i*1.5});extra=m}
else if(r<.8){for(let l=-1;l<=1;l++)if(l!==free||Math.random()<.3)objs.push({t:'low',l,z})}
else{for(let l=-1;l<=1;l++)if(l!==free&&Math.random()<.7)objs.push({t:'high',l,z});objs.push({t:'coin',l:free,z:z+1})}
nextRow=z+12+speed*.3+extra}

function crash(){state='over';deadAt=performance.now();
if(score>best){best=score;try{localStorage.setItem('best',best)}catch(e){}}}

function update(dt){
speed=Math.min(30,12+dist/120);dist+=speed*dt;
px+=(lane-px)*Math.min(1,dt*14);
if(jh>0||vy>0){vy-=32*dt;jh+=vy*dt;if(jh<=0){jh=0;vy=0}}
if(slide>0)slide-=dt;
while(nextRow<dist+60)spawn(nextRow);
for(let i=objs.length-1;i>=0;i--){const o=objs[i],d=o.z-dist;
if(d+(o.len||0)<-3){objs.splice(i,1);continue}
if(Math.abs(o.l-px)>=.6)continue;
if(o.t==='coin'){if(d<.7&&d>-.7){objs.splice(i,1);coins++}}
else if(o.t==='train'){if(d<.4&&d+o.len>-.4)return crash()}
else if(d<.4&&d>-.4){
if(o.t==='low'&&jh<.55)return crash();
if(o.t==='high'&&slide<=0)return crash()}}
score=Math.floor(dist/2)+coins*5}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function tt(s,x,y,size,col){ctx.font='800 '+size+'px Tahoma,Arial,sans-serif';ctx.textAlign='center';ctx.lineWidth=size*.16;ctx.strokeStyle='#0a3a6a';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
const bub=Array.from({length:30},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3,s:.02+Math.random()*.06}));
const fish=Array.from({length:6},(_,i)=>({o:i/6,y:.12+i*.1,s:.02+i*.007,c:['#ffb84d','#ff7a90','#7ee0ff'][i%3]}));

function sponge(x,fy,sw){const u=LW;
ctx.fillStyle='#d9702a';ctx.fillRect(x-.16*u,fy-.32*u,.1*u,.3*u+sw*.05*u);ctx.fillRect(x+.06*u,fy-.32*u,.1*u,.3*u-sw*.05*u);
ctx.fillStyle='#233b6b';ctx.beginPath();ctx.ellipse(x-.12*u,fy+sw*.03*u,.1*u,.045*u,0,0,7);ctx.ellipse(x+.12*u,fy-sw*.03*u,.1*u,.045*u,0,0,7);ctx.fill();
ctx.fillStyle='#f08a3c';rr(x-.36*u,fy-.72*u+sw*.05*u,.1*u,.3*u,.05*u);ctx.fill();rr(x+.26*u,fy-.72*u-sw*.05*u,.1*u,.3*u,.05*u);ctx.fill();
const g=ctx.createLinearGradient(0,fy-1.02*u,0,fy-.3*u);g.addColorStop(0,'#ffc96e');g.addColorStop(1,'#f08a3c');
ctx.fillStyle=g;rr(x-.27*u,fy-1.02*u,.54*u,.72*u,.2*u);ctx.fill();ctx.strokeStyle='#c8621f';ctx.lineWidth=Math.max(1,u*.02);ctx.stroke();
ctx.fillStyle='rgba(160,80,20,.4)';for(const p of[[-.13,-.93,.04],[.15,-.8,.035],[-.16,-.5,.04],[.1,-.4,.05],[.17,-.95,.03],[-.05,-.36,.03]]){ctx.beginPath();ctx.arc(x+p[0]*u,fy+p[1]*u,p[2]*u,0,7);ctx.fill()}
ctx.fillStyle='#2fae6a';for(const dx of[-.09,0,.09]){ctx.beginPath();ctx.moveTo(x+dx*u-.035*u,fy-1.02*u);ctx.lineTo(x+dx*u*1.6,fy-1.16*u-Math.abs(dx)*.3*u);ctx.lineTo(x+dx*u+.035*u,fy-1.02*u);ctx.fill()}
ctx.fillStyle='#1e5fb4';ctx.fillRect(x-.27*u,fy-.81*u,.54*u,.07*u);
for(const s of[-1,1]){const ex=x+s*.115*u,ey=fy-.78*u;ctx.fillStyle='#e8fbff';ctx.beginPath();ctx.arc(ex,ey,.12*u,0,7);ctx.fill();ctx.strokeStyle='#123a7a';ctx.lineWidth=Math.max(1,u*.03);ctx.stroke();
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+s*.01*u+.015*u,ey+.01*u,.045*u,0,7);ctx.fill();
ctx.fillStyle='rgba(255,90,90,.35)';ctx.beginPath();ctx.arc(x+s*.2*u,fy-.58*u,.05*u,0,7);ctx.fill()}
ctx.strokeStyle='#7a2b10';ctx.lineWidth=Math.max(1,u*.03);ctx.beginPath();ctx.arc(x,fy-.64*u,.1*u,.15*Math.PI,.85*Math.PI);ctx.stroke()}

function drawPlayer(){const x=cx+px*LW,fy=gy-jh*LW,sw=Math.sin(dist*1.6)*(jh>0?0:1);
ctx.fillStyle='rgba(0,30,50,.35)';ctx.beginPath();ctx.ellipse(x,gy,LW*.3*(1-jh*.15),LW*.08,0,0,7);ctx.fill();
if(slide>0){ctx.save();ctx.translate(x,fy);ctx.scale(1.25,.55);sponge(0,0,0);ctx.restore()}else sponge(x,fy,sw)}

function scenery(l,d,h){const a=P(l,d),u=LW*a.s,v=h%3,H2=1+h*.25;
if(v===0){const sw=Math.sin(performance.now()/500+d)*u*.12;ctx.fillStyle='#2fae6a';ctx.beginPath();ctx.moveTo(a.x-.12*u,a.y);ctx.quadraticCurveTo(a.x+sw,a.y-1.5*u,a.x-.05*u+sw*1.5,a.y-(1+H2)*u);ctx.lineTo(a.x+.1*u+sw*1.5,a.y-(1+H2)*u);ctx.quadraticCurveTo(a.x+.15*u+sw,a.y-1.5*u,a.x+.12*u,a.y);ctx.fill()}
else if(v===1){ctx.fillStyle='#ff6f91';ctx.fillRect(a.x-.22*u,a.y-H2*u,.44*u,H2*u);ctx.beginPath();ctx.arc(a.x,a.y-H2*u,.36*u,0,7);ctx.fill();ctx.fillStyle='#ffa3b8';ctx.beginPath();ctx.arc(a.x-.1*u,a.y-H2*u-.05*u,.1*u,0,7);ctx.arc(a.x+.12*u,a.y-H2*u+.08*u,.07*u,0,7);ctx.fill()}
else{ctx.fillStyle='#4f7b9c';ctx.beginPath();ctx.ellipse(a.x,a.y-.4*u,.85*u,.55*u,0,0,7);ctx.fill();ctx.fillStyle='#6f9bbc';ctx.beginPath();ctx.ellipse(a.x-.2*u,a.y-.55*u,.4*u,.25*u,0,0,7);ctx.fill()}}

function draw(){
const T=performance.now()/1000;
let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#0b5ea8');g.addColorStop(1,'#4fd6d8');ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);
ctx.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<5;i++){const bx=W*(i/4)+Math.sin(T*.4+i)*30;ctx.beginPath();ctx.moveTo(bx-20,0);ctx.lineTo(bx+20,0);ctx.lineTo(bx+90,hz);ctx.lineTo(bx-90,hz);ctx.fill()}
for(const f of fish){const fx=((T*f.s+f.o)%1.3-.15)*W,fy=f.y*hz*1.3;ctx.fillStyle=f.c;ctx.beginPath();ctx.ellipse(fx,fy,11,5,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(fx-9,fy);ctx.lineTo(fx-18,fy-6);ctx.lineTo(fx-18,fy+6);ctx.fill()}
ctx.fillStyle='#1b86ad';ctx.beginPath();ctx.moveTo(0,hz);for(let x=0;x<=W;x+=10)ctx.lineTo(x,hz-10-8*Math.sin(x*.05)-6*Math.sin(x*.13+1));ctx.lineTo(W,hz);ctx.fill();
g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#2e8fa0');g.addColorStop(1,'#155d78');ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
for(let i=14;i>=0;i--){const k=Math.floor(dist/4)+i,d=k*4-dist;if(d<-2)continue;
for(const sd of[-1,1]){const h=((k*73+sd*31)%7+7)%7;scenery(sd*(2.4+(k%2)*1.1),d,h)}}
band(-F*.6,200,-1.65,1.65,'#e6cd93');
const off=dist%3;
for(let k=0;k<22;k++){const d0=k*3-off,d1=d0+1.5;if(d1<-F*.5)continue;const a=Math.max(d0,-F*.6);
band(a,d1,-1.65,1.65,'#dcc084');band(a,d1,-.52,-.48,'rgba(150,110,50,.4)');band(a,d1,.48,.52,'rgba(150,110,50,.4)')}
band(-F*.6,200,-1.7,-1.6,'#b98d4a');band(-F*.6,200,1.6,1.7,'#b98d4a');
for(const o of objs.slice().sort((a,b)=>b.z-a.z)){
const d=o.z-dist;if(d>62||d+(o.len||0)<-1.5)continue;
if(o.t==='coin'){if(d<-1)continue;const p=P(o.l,d),u=LW*p.s,r=.17*u,cy=p.y-.45*u;
const gl=ctx.createRadialGradient(p.x,cy,r*.3,p.x,cy,r*2.2);gl.addColorStop(0,'rgba(255,240,150,.5)');gl.addColorStop(1,'rgba(255,240,150,0)');
ctx.fillStyle=gl;ctx.beginPath();ctx.arc(p.x,cy,r*2.2,0,7);ctx.fill();
ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(p.x,cy,Math.max(1,r*Math.abs(Math.cos(T*6+o.z))),r,0,0,7);ctx.fill();
ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(p.x-r*.25,cy-r*.3,r*.22,0,7);ctx.fill()}
else if(o.t==='train'){const dd=Math.max(d,-1.2);box(o.l,dd,.92,1.7,'#6b4a3a','#94705a',o.len-(dd-d));
const p=P(o.l,dd),u=LW*p.s;ctx.fillStyle='#4a3226';ctx.fillRect(p.x-.46*u,p.y-.5*u,.92*u,.1*u);
for(const s of[-1,1]){ctx.fillStyle='#9be7ff';ctx.beginPath();ctx.arc(p.x+s*.2*u,p.y-1.1*u,.15*u,0,7);ctx.fill();ctx.strokeStyle='#c9a14a';ctx.lineWidth=Math.max(1,u*.04);ctx.stroke()}}
else if(o.t==='low'){if(d<-1)continue;const p=P(o.l,d),u=LW*p.s,cy=p.y-.28*u;
ctx.strokeStyle='#5b2a86';ctx.lineWidth=Math.max(1,u*.05);ctx.beginPath();for(let a=0;a<12;a++){const an=a*Math.PI/6;ctx.moveTo(p.x+Math.cos(an)*.2*u,cy+Math.sin(an)*.2*u);ctx.lineTo(p.x+Math.cos(an)*.32*u,cy+Math.sin(an)*.32*u)}ctx.stroke();
ctx.fillStyle='#7b3fb0';ctx.beginPath();ctx.arc(p.x,cy,.24*u,0,7);ctx.fill();ctx.fillStyle='#ff5b8a';ctx.beginPath();ctx.arc(p.x,cy,.08*u,0,7);ctx.fill()}
else{if(d<-1)continue;const p=P(o.l,d),u=LW*p.s,sw=Math.sin(T*3+o.z)*.05*u,by=p.y-1.35*u;
ctx.strokeStyle='rgba(255,170,220,.85)';ctx.lineWidth=Math.max(1,u*.04);for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(p.x+i*.14*u,by);ctx.quadraticCurveTo(p.x+i*.14*u+sw,by+.2*u,p.x+i*.14*u,p.y-.9*u);ctx.stroke()}
ctx.fillStyle='rgba(255,140,200,.9)';ctx.beginPath();ctx.ellipse(p.x,by,.45*u,.35*u,0,Math.PI,0);ctx.fill();
ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(p.x-.15*u,by-.15*u,.12*u,.07*u,-.5,0,7);ctx.fill()}}
drawPlayer();
ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;for(const b of bub){const by=((b.y-T*b.s)%1+1)%1;ctx.beginPath();ctx.arc(b.x*W+Math.sin(T+b.y*9)*6,by*H,b.r,0,7);ctx.stroke()}
g=ctx.createRadialGradient(cx,H*.5,H*.3,cx,H*.5,H*.85);g.addColorStop(0,'rgba(0,20,50,0)');g.addColorStop(1,'rgba(0,20,50,.45)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(0,30,60,.55)';rr(12,58,160,38,19);ctx.fill();rr(W-122,58,110,38,19);ctx.fill();
tx('النقاط: '+score,26,84,20,'#fff','left');tx(coins+'',W-24,84,20,'#ffe27a','right');
ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(W-100,77,9,0,7);ctx.fill();
if(state==='over'&&performance.now()-deadAt<300){ctx.fillStyle='rgba(255,0,0,.35)';ctx.fillRect(0,0,W,H)}
if(state!=='play'){
ctx.fillStyle='rgba(0,20,50,.5)';ctx.fillRect(0,0,W,H);
const fs=Math.min(46,W*.115);
if(state==='menu'){
tt('مغامرة الإسفنج',cx,H*.2,fs,'#ffd54a');tx('المس الشاشة للبدء',cx,H*.29,22,'#fff');
ctx.fillStyle='rgba(0,30,60,.6)';rr(cx-W*.42,H*.35,W*.84,H*.22,16);ctx.fill();
tx('↔ اسحب يمينًا أو يسارًا لتغيير المسار',cx,H*.395,16,'#e8f6ff');
tx('↑ اسحب لأعلى للقفز فوق قنافذ البحر',cx,H*.44,16,'#e8f6ff');
tx('↓ اسحب لأسفل للانزلاق تحت قناديل البحر',cx,H*.485,16,'#e8f6ff');
tx('تجنّب حطام السفن، واجمع اللآلئ الذهبية',cx,H*.53,16,'#e8f6ff')
}else{
tt('اصطدمت!',cx,H*.3,fs,'#ff6b5e');tx('النقاط: '+score,cx,H*.4,26,'#fff');
tx('اللآلئ: '+coins,cx,H*.46,20,'#ffd54a');tx('أفضل نتيجة: '+best,cx,H*.52,20,'#fff');
tx('المس الشاشة للعب مجددًا',cx,H*.62,22,'#fff')}}}

let sx=0,sy=0,sw=false;
function tap(){if(state==='menu'||(state==='over'&&performance.now()-deadAt>500))start()}
addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];sx=t.clientX;sy=t.clientY;sw=false;tap()},{passive:false});
addEventListener('touchmove',e=>{e.preventDefault();if(sw||state!=='play')return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
if(Math.max(Math.abs(dx),Math.abs(dy))>28){sw=true;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else down()}},{passive:false});
addEventListener('mousedown',tap);
addEventListener('keydown',e=>{const k=e.key;
if(state!=='play'){if(k===' '||k==='Enter')tap();return}
if(k==='ArrowLeft'||k==='a')move(-1);else if(k==='ArrowRight'||k==='d')move(1);
else if(k==='ArrowUp'||k==='w'||k===' ')jump();else if(k==='ArrowDown'||k==='s')down()});

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
if(state==='play')update(dt);else if(state==='menu')dist+=8*dt;
draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
